  <!-- Decorative elements -->
  <circle cx="100" cy="500" r="3" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="150" cy="520" r="2" fill="#F59E0B" opacity="0.6"/>
  <circle cx="200" cy="510" r="2.5" fill="#10B981" opacity="0.6"/>
  
  <circle cx="900" cy="400" r="3" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="950" cy="420" r="2" fill="#F59E0B" opacity="0.6"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
