<svg width="1024" height="576" viewBox="0 0 1024 576" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="576" fill="url(#gradient-bg)"/>
  
  <!-- Mobile Device -->
  <rect x="40" y="40" width="240" height="420" rx="20" fill="#1E293B" stroke="#475569" stroke-width="2"/>
