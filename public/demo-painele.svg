  <text x="908" y="290" fill="#9CA3AF" text-anchor="middle" font-size="8" font-family="Arial">2 produtos venderam mais de 50% do estoque inicial</text>
  <text x="908" y="310" fill="#9CA3AF" text-anchor="middle" font-size="8" font-family="Arial">3 produtos venderam mais de 50% do estoque inicial</text>
  
