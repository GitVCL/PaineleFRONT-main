  <text x="908" y="200" fill="white" text-anchor="middle" font-size="10" font-family="Arial">Produtos em Estoque</text>
  <text x="908" y="215" fill="white" text-anchor="middle" font-size="14" font-weight="bold" font-family="Arial">2 itens</text>
  
